name: Sync Status Labels

on:
  workflow_dispatch:

jobs:
  sync-status-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/.github
          token: ${{ secrets.PAT }}
          path: dot-github

      - name: Synchronize status labels across all repos
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const { STATUS_LABELS, LABEL_COLORS } = require('./dot-github/.github/scripts/status-labels.js');
            const owner = context.repo.owner;

            // Get all repos in the org
            const repos = await github.paginate(github.rest.repos.listForOrg, { org: owner });
            for (const repo of repos) {
              const repoName = repo.name;
              core.info(`Syncing labels for repo: ${owner}/${repoName}`);

              // Get existing labels
              const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo: repoName });
              const existingByName = new Map(existingLabels.map(l => [l.name, l]));

              // Upsert: never delete, so labels stay attached to their issues
              for (const label of STATUS_LABELS) {
                const color = LABEL_COLORS[label] || 'ededed';
                const existing = existingByName.get(label);

                if (!existing) {
                  await github.rest.issues.createLabel({ owner, repo: repoName, name: label, color });
                  core.info(`Created label: ${label}`);
                } else if (existing.color.toLowerCase() !== color.toLowerCase()) {
                  await github.rest.issues.updateLabel({ owner, repo: repoName, name: label, color });
                  core.info(`Updated color for label: ${label}`);
                } else {
                  core.info(`Label already up to date: ${label}`);
                }
              }
            }
