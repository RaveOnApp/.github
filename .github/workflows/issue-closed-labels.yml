name: Issue Closed Labels

on:
  issues:
    types: [closed]
  workflow_call:

jobs:
  set-closing-label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/.github
          token: ${{ secrets.PAT }}
          path: dot-github

      - name: Apply Release or Cancel label on close
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const { STATUS_LABELS, LABEL_COLORS } = require('./dot-github/.github/scripts/status-labels.js');

            const issue = context.payload.issue;
            if (!issue) {
              core.setFailed("Aucune issue dans le payload de l'événement.");
              return;
            }

            const owner = context.payload.repository.owner.login;
            const repo = context.payload.repository.name;
            const issueNumber = issue.number;

            const currentLabels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            const targetLabel = currentLabels.includes('Pre-release') ? 'Release' : 'Cancel';

            if (currentLabels.includes(targetLabel)) {
              core.info(`Issue #${issueNumber} : label "${targetLabel}" déjà présent, rien à faire.`);
              return;
            }

            // S'assurer que le label existe dans le repo
            try {
              await github.rest.issues.getLabel({ owner, repo, name: targetLabel });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: targetLabel,
                color: LABEL_COLORS[targetLabel] || 'ededed',
              });
              core.info(`Label "${targetLabel}" créé dans ${owner}/${repo}.`);
            }

            // Retirer les autres labels de statut, poser le label cible
            const newLabels = [
              ...currentLabels.filter(l => !STATUS_LABELS.includes(l)),
              targetLabel,
            ];

            await github.rest.issues.setLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: newLabels,
            });

            core.info(`Issue #${issueNumber} fermée : label "${targetLabel}" appliqué (était : ${currentLabels.join(', ') || 'aucun'}).`);
